services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avalon}
      POSTGRES_USER: ${POSTGRES_USER:-avalon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - "${AVALON_POSTGRES_DATA:-avalon-postgres-data}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      AVALON_STORAGE: postgres
      AVALON_GAME_PORT: 8000
      AVALON_LOBBY_PORT: 8001
      AVALON_ORIGINS: ${AVALON_ORIGINS:?AVALON_ORIGINS is required}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-avalon}
      PGUSER: ${POSTGRES_USER:-avalon}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  gateway:
    build:
      context: .
      target: gateway
    restart: unless-stopped
    ports:
      - "${AVALON_BIND_ADDRESS:-127.0.0.1}:${AVALON_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  avalon-postgres-data:
