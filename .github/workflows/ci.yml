name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  PNPM_VERSION: 11.21.0
  NODE_VERSION: 24

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  unit-and-socket:
    name: Unit and Socket.IO replay
    runs-on: ubuntu-latest
    env:
      AVALON_PROPERTY_PROGRESS: '1'
      FAST_CHECK_SEED: '424242'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  postgres:
    name: PostgreSQL persistence and reconnect
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: avalon_test
          POSTGRES_PASSWORD: avalon
          POSTGRES_USER: avalon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avalon -d avalon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://avalon:avalon@127.0.0.1:5432/avalon_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:postgres
      - name: Save a credential-bound game before database restart
        run: pnpm --filter @avalon/server test:postgres:restart-probe prepare "$RUNNER_TEMP/avalon-postgres-restart.json"
      - name: Restart PostgreSQL service container
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker restart "$POSTGRES_CONTAINER"
          for attempt in {1..30}; do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U avalon -d avalon_test; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Reconnect with the original credential
        run: pnpm --filter @avalon/server test:postgres:restart-probe verify "$RUNNER_TEMP/avalon-postgres-restart.json"

  browser-smoke-execution:
    name: Browser smoke execution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @avalon/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e:smoke
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-${{ github.run_id }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  compose-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    needs: [quality, unit-and-socket]
    env:
      AVALON_BIND_ADDRESS: 127.0.0.1
      AVALON_ORIGINS: http://127.0.0.1:18080
      AVALON_PORT: 18080
      POSTGRES_DB: avalon_validation
      POSTGRES_PASSWORD: validation-only
      POSTGRES_USER: avalon
    steps:
      - uses: actions/checkout@v7
      - name: Render named-volume configuration
        run: docker compose -p avalon-validation config > /dev/null
      - name: Render bind-mount configuration
        env:
          AVALON_POSTGRES_DATA: ./.ci-data
        run: docker compose -p avalon-validation config > /dev/null
      - name: Build and start the stack
        run: docker compose -p avalon-validation up -d --build --wait
      - name: Verify gateway routing and published ports
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18080/healthz
          curl --fail --silent --show-error http://127.0.0.1:18080/ > /dev/null
          curl --fail --silent --show-error \
            -H 'X-Forwarded-Prefix: /one/two/avalon' \
            http://127.0.0.1:18080/ | grep -F '<base href="/one/two/avalon/" />'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'X-Forwarded-Prefix: /../invalid' \
            http://127.0.0.1:18080/)" = 400
          test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' \
            "$(docker compose -p avalon-validation ps -q server)")" = '{}'
          test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' \
            "$(docker compose -p avalon-validation ps -q postgres)")" = '{}'
      - name: Show container logs after failure
        if: failure()
        run: docker compose -p avalon-validation logs --no-color
      - name: Remove disposable stack
        if: always()
        run: docker compose -p avalon-validation down -v
  browser-regression:
    name: Browser regression (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @avalon/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @avalon/e2e exec playwright test --grep-invert @smoke --shard=${{ matrix.shard }}/2
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-regression-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  browser-gate:
    name: Browser smoke
    if: always()
    needs:
      - browser-smoke-execution
      - browser-regression
    runs-on: ubuntu-latest
    steps:
      - name: Require smoke and regression checks
        env:
          REGRESSION_RESULT: ${{ needs.browser-regression.result }}
          SMOKE_RESULT: ${{ needs.browser-smoke-execution.result }}
        run: |
          if [[ "$SMOKE_RESULT" != success || "$REGRESSION_RESULT" != success ]]; then
            echo "Browser checks failed: smoke=$SMOKE_RESULT regression=$REGRESSION_RESULT"
            exit 1
          fi
