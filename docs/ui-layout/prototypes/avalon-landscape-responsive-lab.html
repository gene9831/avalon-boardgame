}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    function taskMarkup(task,index) {

      return `&lt;button class=&quot;alp-task ${task.state}&quot; type=&quot;button&quot; data-task=&quot;${index + 1}&quot; aria-label=&quot;第 ${index + 1} 个任务，需要 ${task.people} 名成员${task.fails ? `，至少 ${task.fails} 张失败牌才会失败` : &#x27;&#x27;}${result}&quot;&gt;
        &lt;span class=&quot;alp-task-number&quot;&gt;${task.number}&lt;/span&gt;
        &lt;span class=&quot;alp-task-meta&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;span class=&quot;alp-task-meta-item&quot;&gt;&lt;span&gt;♟&lt;/span&gt;${task.people}&lt;/span&gt;
          ${task.fails ? `&lt;span class=&quot;alp-task-meta-item is-threshold&quot;&gt;&lt;span&gt;▣&lt;/span&gt;${task.fails}&lt;/span&gt;` : &#x27;&#x27;}
        &lt;/span&gt;
      &lt;/button&gt;`;
    }

    function setupTasks() {
      const markup = taskData.map(taskMarkup).join(&#x27;&#x27;);
      root.querySelector(&#x27;.alp-task-track&#x27;).innerHTML = markup;
      root.querySelector(&#x27;.alp-task-list&#x27;).innerHTML = markup;
      root.querySelectorAll(&#x27;.alp-task&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const index = Number(button.dataset.task) - 1;
          dialogTitle.textContent = `第 ${index + 1} 个任务`;
          dialogCopy.textContent = taskData[index].copy;
          if (typeof dialog.showModal === &#x27;function&#x27;) dialog.showModal();
        });
      });
    }

    function setBox(element,left,top,width,height) {
      Object.assign(element.style,{ left:`${left}px`, top:`${top}px`, width:`${width}px`, height:`${height}px` });
    }

    function seatMarkup(player,geometry) {
      const { seatWidth,seatHeight,avatar } = geometry;
      const marker = Math.max(16,Math.round(avatar * .24));
      const crown = Math.max(18,Math.round(avatar * .28));
      return `&lt;span class=&quot;alp-avatar&quot; style=&quot;left:${(seatWidth-avatar)/2}px;width:${avatar}px;height:${avatar}px&quot;&gt;${player.initial}&lt;/span&gt;
        ${player.leader ? `&lt;span class=&quot;alp-leader&quot; aria-label=&quot;当前领袖&quot; style=&quot;left:${(seatWidth-crown)/2}px;top:-5px;width:${crown}px;height:${crown}px;font-size:${Math.max(11,crown-7)}px&quot;&gt;♛&lt;/span&gt;` : &#x27;&#x27;}
        ${player.selected ? `&lt;span class=&quot;alp-team-marker&quot; aria-label=&quot;已选择&quot; style=&quot;left:${(seatWidth+avatar)/2-marker*.7}px;top:${avatar-marker*.9}px;width:${marker}px;height:${marker}px;font-size:11px&quot;&gt;◆&lt;/span&gt;` : &#x27;&#x27;}
        &lt;span class=&quot;alp-seat-name&quot; style=&quot;top:${avatar+4}px;height:${seatHeight-avatar-4}px&quot;&gt;${player.seat} · ${player.name}&lt;/span&gt;`;
    }

    function renderSeats(layer,points,geometry) {
      layer.replaceChildren();
      players.forEach((player,index) =&gt; {
        const point = points[index];
        const seat = document.createElement(&#x27;button&#x27;);
        seat.type = &#x27;button&#x27;;
        seat.className = &#x27;alp-seat&#x27;;
        seat.style.left = `${point.x - geometry.seatWidth / 2}px`;
        seat.style.top = `${point.y - geometry.avatar / 2}px`;
        seat.style.width = `${geometry.seatWidth}px`;
        seat.style.height = `${geometry.seatHeight}px`;
        seat.setAttribute(&#x27;aria-pressed&#x27;,String(player.selected));
        seat.setAttribute(&#x27;aria-label&#x27;,`${player.seat} 号座位，${player.name}${player.leader ? &#x27;，当前领袖&#x27; : &#x27;&#x27;}`);
        seat.innerHTML = seatMarkup(player,geometry);
        seat.addEventListener(&#x27;click&#x27;,() =&gt; {
          player.selected = !player.selected;
          render();
        });
        layer.appendChild(seat);
      });
    }

    function renderSelection() {
      const selected = players.filter((player) =&gt; player.selected);
      root.querySelectorAll(&#x27;.alp-count&#x27;).forEach((el) =&gt; { el.textContent = `${selected.length} / 5`; });
      root.querySelectorAll(&#x27;.alp-selected-list&#x27;).forEach((list) =&gt; {
        list.replaceChildren(...selected.map((player) =&gt; {
          const chip = document.createElement(&#x27;span&#x27;);
          chip.textContent = player.seat;
          chip.setAttribute(&#x27;aria-label&#x27;,`${player.seat} · ${player.name}`);
          return chip;
        }));
      });
      root.querySelectorAll(&#x27;.alp-confirm&#x27;).forEach((button) =&gt; { button.disabled = selected.length !== 5; });
    }

    function normalGeometry() {
      const topbar = state.height &lt; 680 ? 48 : 56;
      const margin = topbar === 48 ? 12 : 16;
      const side = clamp(288,state.width * .28,384);
      const stageWidth = state.width - 2 - side;
      const stageHeight = state.height - 2 - topbar;
      const safeWidth = stageWidth - margin * 2;
      const safeHeight = stageHeight - margin * 2;
      let q = Math.min(640,(safeWidth-104)/.86,(safeHeight-82)/.86);
      let seatWidth = q &gt;= 560 ? 104 : q &gt;= 440 ? 88 : 72;
      let seatHeight = q &gt;= 560 ? 82 : q &gt;= 440 ? 74 : 64;
      let avatar = q &gt;= 560 ? 62 : q &gt;= 440 ? 52 : 44;
      q = Math.max(320,Math.floor(Math.min(640,(safeWidth-seatWidth)/.86,(safeHeight-seatHeight)/.86)));
      const radius = .43 * q;
      const table = .74 * q;
      const centerX = stageWidth / 2;
      const compensationY = (seatHeight-avatar) / 2;
      const orbitCenterY = stageHeight / 2 - compensationY;
      return { topbar,margin,side,stageWidth,stageHeight,q,radius,table,centerX,orbitCenterY,seatWidth,seatHeight,avatar };
    }

    function renderNormal() {
      const g = normalGeometry();
      canvas.style.setProperty(&#x27;--alp-topbar-h&#x27;,`${g.topbar}px`);
      canvas.style.setProperty(&#x27;--alp-side-w&#x27;,`${g.side}px`);
      const stage = root.querySelector(&#x27;.alp-normal-stage&#x27;);
      const safe = stage.querySelector(&#x27;.alp-safe-stage&#x27;);
      const square = stage.querySelector(&#x27;.alp-q-square&#x27;);
      const tabletop = stage.querySelector(&#x27;.alp-normal-tabletop&#x27;);
      const footprint = stage.querySelector(&#x27;.alp-normal-footprint&#x27;);
      Object.assign(safe.style,{inset:`${g.margin}px`});
      setBox(square,g.centerX-g.q/2,g.stageHeight/2-g.q/2,g.q,g.q);
      setBox(tabletop,g.centerX-g.table/2,g.stageHeight/2-g.table/2,g.table,g.table);
      const points = players.map((_,index) =&gt; {
        const angle = -Math.PI/2 + index * Math.PI * 2 / players.length;
        return { x:g.centerX + Math.cos(angle)*g.radius, y:g.orbitCenterY + Math.sin(angle)*g.radius };
      });
      renderSeats(stage.querySelector(&#x27;.alp-normal-seats&#x27;),points,g);
      setBox(footprint,g.centerX-g.radius-g.seatWidth/2,g.orbitCenterY-g.radius-g.avatar/2,2*g.radius+g.seatWidth,2*g.radius+g.seatHeight);
    }

    function stadiumPoint(index,total,width,height) {
      const radius = height / 2;
      const straightHalf = Math.max(0,(width-height)/2);
      const arcLength = Math.PI * radius;
      const perimeter = 4*straightHalf + 2*arcLength;
      let distance = index * perimeter / total;
      if (distance &lt;= straightHalf) return {x:-distance,y:radius};
      distance -= straightHalf;
      if (distance &lt;= arcLength) {
        const angle = Math.PI/2 + distance/radius;
        return {x:-straightHalf+radius*Math.cos(angle),y:radius*Math.sin(angle)};
      }
      distance -= arcLength;
      if (distance &lt;= 2*straightHalf) return {x:-straightHalf+distance,y:-radius};
      distance -= 2*straightHalf;
      if (distance &lt;= arcLength) {
        const angle = -Math.PI/2 + distance/radius;
        return {x:straightHalf+radius*Math.cos(angle),y:radius*Math.sin(angle)};
      }
      distance -= arcLength;
      return {x:straightHalf-distance,y:radius};
    }

    function compactGeometry() {
      const side = state.width &lt; 720 ? 192 : clamp(224,state.width*.28,288);
      const stageWidth = state.width - 2 - 56 - side;
      const stageHeight = state.height - 2;
      const seatWidth = clamp(72,state.height*.213,88);
      const seatHeight = seatWidth*.825;
      const avatar = clamp(38,state.height*.107,46);
      const orbitWidth = Math.max(220,Math.min(state.height*.88,stageWidth-seatWidth-16));
      const orbitHeight = Math.min(state.height*.656,orbitWidth);
      const table = Math.min(state.height*.544,orbitHeight*.83);
      const centerX = stageWidth/2;
      const centerY = stageHeight/2-(seatHeight-avatar)/2+2;
      return { side,stageWidth,stageHeight,seatWidth,seatHeight,avatar,orbitWidth,orbitHeight,table,centerX,centerY };
    }

    function renderCompact() {
      const g = compactGeometry();
      canvas.style.setProperty(&#x27;--alp-side-w&#x27;,`${g.side}px`);
      canvas.style.setProperty(&#x27;--alp-task-gap&#x27;,`${clamp(8,state.height*.025,12)}px`);
      const stage = root.querySelector(&#x27;.alp-compact-stage&#x27;);
      const safe = stage.querySelector(&#x27;.alp-safe-stage&#x27;);
      const orbit = stage.querySelector(&#x27;.alp-compact-orbit&#x27;);
      const tabletop = stage.querySelector(&#x27;.alp-compact-tabletop&#x27;);
      const footprint = stage.querySelector(&#x27;.alp-compact-footprint&#x27;);
      Object.assign(safe.style,{inset:&#x27;8px&#x27;});
      setBox(orbit,g.centerX-g.orbitWidth/2,g.centerY-g.orbitHeight/2,g.orbitWidth,g.orbitHeight);
      setBox(tabletop,g.centerX-g.table/2,g.stageHeight/2-g.table/2,g.table,g.table);
      const points = players.map((_,index) =&gt; {
        const point = stadiumPoint(index,players.length,g.orbitWidth,g.orbitHeight);
        return {x:g.centerX+point.x,y:g.centerY+point.y};
      });
      renderSeats(stage.querySelector(&#x27;.alp-compact-seats&#x27;),points,g);
      setBox(footprint,g.centerX-g.orbitWidth/2-g.seatWidth/2,g.centerY-g.orbitHeight/2-g.avatar/2,g.orbitWidth+g.seatWidth,g.orbitHeight+g.seatHeight);
    }

    function updateScale(mode) {
      const availableWidth = shell.clientWidth;
      const maxPreviewHeight = 640;
      const scale = Math.min(1,availableWidth/state.width,maxPreviewHeight/state.height);
      canvas.style.width = `${state.width}px`;
      canvas.style.height = `${state.height}px`;
      canvas.style.transform = `translateX(-50%) scale(${scale})`;
      shell.style.height = `${Math.ceil(state.height*scale)}px`;
      status.textContent = `${state.width} × ${state.height} · ${mode} · ${Math.round(scale*100)}%`;
    }

    function updatePresets() {
      root.querySelectorAll(&#x27;[data-size]&#x27;).forEach((button) =&gt; {
        button.setAttribute(&#x27;aria-pressed&#x27;,String(button.dataset.size === `${state.width}x${state.height}`));
      });
    }

    function render() {
      state.width = clamp(667,Math.round(state.width),3840);
      state.height = clamp(375,Math.round(state.height),Math.min(2160,state.width));
      widthInput.value = state.width;
      heightInput.max = Math.min(2160,state.width);
      heightInput.value = state.height;
      widthValue.textContent = `${state.width} px`;
      heightValue.textContent = `${state.height} px`;
      const compact = state.height &lt; 515;
      canvas.classList.toggle(&#x27;alp-compact-mode&#x27;,compact);
      canvas.classList.toggle(&#x27;alp-normal-mode&#x27;,!compact);
      canvas.classList.toggle(&#x27;alp-debug&#x27;,state.showBounds);
      if (compact) renderCompact(); else renderNormal();
      renderSelection();
      updateScale(compact ? &#x27;紧凑横版&#x27; : &#x27;普通横版&#x27;);
      updatePresets();
    }

    widthInput.addEventListener(&#x27;input&#x27;,() =&gt; {
      state.width = Number(widthInput.value);
      if (state.height &gt; state.width) state.height = state.width;
      render();
    });
    heightInput.addEventListener(&#x27;input&#x27;,() =&gt; {
      state.height = Math.min(Number(heightInput.value),state.width);
      render();
    });
    bounds.addEventListener(&#x27;change&#x27;,() =&gt; { state.showBounds = bounds.checked; render(); });
    root.querySelectorAll(&#x27;[data-size]&#x27;).forEach((button) =&gt; {
      button.addEventListener(&#x27;click&#x27;,() =&gt; {
        const [width,height] = button.dataset.size.split(&#x27;x&#x27;).map(Number);
        state.width = width;
        state.height = height;
        render();
      });
    });
    new ResizeObserver(() =&gt; { render(); }).observe(shell);

    setupTasks();
    render();

    if (globalThis.Tweak) {
      const tweak = new Tweak({ container:canvas, onChange:render });
      tweak.addSlider(state,&#x27;width&#x27;,{label:&#x27;逻辑宽度&#x27;,min:667,max:3840,unit:&#x27;px&#x27;,reference:&#x27;viewport.width&#x27;});
      tweak.addSlider(state,&#x27;height&#x27;,{label:&#x27;逻辑高度&#x27;,min:375,max:2160,unit:&#x27;px&#x27;,reference:&#x27;viewport.height&#x27;});
      tweak.addToggle(state,&#x27;showBounds&#x27;,{label:&#x27;显示几何边界&#x27;,reference:&#x27;geometry.bounds&#x27;});
    }
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
