map $http_x_forwarded_prefix $avalon_base_path {
  default "";
  "" "/";
  ~^/$ "/";
  ~^/(?:[A-Za-z0-9_~-](?:[A-Za-z0-9._~-]*[A-Za-z0-9_~-])?/)*[A-Za-z0-9_~-](?:[A-Za-z0-9._~-]*[A-Za-z0-9_~-])?/?$ $http_x_forwarded_prefix;
}

map $avalon_base_path $avalon_base_href {
  ~/$ $avalon_base_path;
  default $avalon_base_path/;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

map $http_x_forwarded_proto $avalon_forwarded_proto {
  default $scheme;
  http http;
  https https;
}

upstream avalon_game {
  server server:8000;
}

upstream avalon_lobby {
  server server:8001;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;

  if ($avalon_base_path = "") {
    return 400;
  }

  error_page 502 504 = @service_unavailable;

  location = /healthz {
    proxy_intercept_errors on;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $avalon_forwarded_proto;
    proxy_pass http://avalon_lobby/healthz;
  }

  location ^~ /socket.io/ {
    proxy_intercept_errors on;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $avalon_forwarded_proto;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_pass http://avalon_game;
  }

  location ~ ^/(?:games|rooms/avalon|dev)(?:/|$) {
    proxy_intercept_errors on;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $avalon_forwarded_proto;
    proxy_pass http://avalon_lobby;
  }

  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    sub_filter '<base href="/" />' '<base href="$avalon_base_href" />';
    sub_filter_once on;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location @service_unavailable {
    internal;
    default_type application/json;
    return 503 '{"error":{"code":"service_unavailable","message":"Service temporarily unavailable"}}';
  }
}
